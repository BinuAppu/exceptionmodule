[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exception-manager"
version = "0.1.0"
description = "Enterprise technology exception management platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141.1,<1.0",
  "starlette>=1.7,<2.0",
  "uvicorn[standard]>=0.34,<1.0",
  "sqlalchemy>=2.0.54,<3.0",
  "alembic>=1.14,<2.0",
  "psycopg[binary]>=3.2.13,<4.0",
  "pydantic-settings>=2.7,<3.0",
  "email-validator>=2.2,<3.0",
  "python-multipart>=0.0.32,<1.0",
  "httpx>=0.28,<1.0",
  "authlib>=1.8,<2.0",
  "pysaml2>=7.5,<8.0",
  "xmlsec>=1.3.17,<2.0",
  "defusedxml>=0.7.1,<1.0",
  "argon2-cffi>=23.1,<26.0",
  "pyjwt[crypto]>=2.15,<3.0",
  "azure-identity>=1.24,<2.0",
  "python-magic>=0.4.27,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "httpx>=0.28,<1.0",
  "ruff>=0.9,<1.0",
  "mypy>=1.14,<2.0",
  "bandit>=1.8,<2.0",
  "pip-audit>=2.7,<3.0",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q --strict-markers"
markers = [
  "security: security-focused tests",
  "integration: integration tests",
  "workflow: workflow tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
